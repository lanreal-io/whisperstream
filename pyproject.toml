[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "whisperstream"
version = "2.0.0"
description = "parakeetV3 powered cpu only Speech-To-Text Local Inference on Windows. Inspired by hyprwhspr on Omarchy."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    "pynput>=1.7.6",
    "numpy>=2.3.4",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "onnxruntime>=1.23.0",
    "platformdirs>=4.5.0",
    "psutil>=5.9.0",
    "pycaw>=20230407; sys_platform == 'win32'",
    "pygame>=2.6.0; python_version < '3.14'",
    "pygame-ce>=2.5.7; python_version >= '3.14'",
    "pyperclip>=1.11.0",
    "rich>=14.2.0",
    "sounddevice>=0.5.3",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.34.0",
    "pywin32>=308; sys_platform == 'win32'",
    "websockets>=14.0",
    "comtypes>=1.4.0 ; sys_platform == 'win32'",
    "cryptography>=49.0.0",
    "metaphone==0.6",
    "rapidfuzz>=3.14.0,<4",
]

[project.optional-dependencies]
build = ["nuitka>=4.1", "ordered-set>=4.1", "zstandard>=0.23"]
dev = ["scipy>=1.14", "pytest>=8.0", "httpx>=0.27", "python-dotenv>=1.0", "soundfile>=0.12", "pytest-xdist>=3.6"]

[project.scripts]
whisperstream = "whisperstream.main:main"
whisperstream-setup = "whisperstream.setup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whisperstream"]

[tool.hatch.build.targets.wheel.package-data]
"whisperstream" = ["assets/*.wav", "assets/*.ico", "assets/silero_vad.onnx", "assets/silero-vad-LICENSE.txt", "cloud-models.json"]
"whisperstream.claude_hook" = ["*.ps1"]
"whisperstream.claude_plugin" = [
    ".claude-plugin/plugin.json",
    "skills/speak/SKILL.md",
    "skills/name/SKILL.md",
    "hooks/hooks.json",
    "hooks/register.js",
    "scripts/forward-hook.ps1",
    "scripts/forward-hook.sh",
]
"whisperstream.codex_plugin" = [
    ".codex-plugin/plugin.json",
    "skills/speak/SKILL.md",
    "hooks/hooks.json",
    "scripts/forward-hook.cmd",
    "scripts/forward-hook.ps1",
]

[tool.hatch.build.targets.sdist]
include = ["src/whisperstream", "README.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

# Official platform wheels only. No sdist or alternate native payload fallback.
[tool.uv.sources]
sherpa-onnx = [
    { url = "https://files.pythonhosted.org/packages/24/af/33e9dcaa527bbc0c2526959713626607a46da2d7b19871b7773d8607d356/sherpa_onnx-1.13.8-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
    { url = "https://files.pythonhosted.org/packages/52/1f/a96759b33dab99647e57f94040d678c332e0d7eb595127d1e0b4e0b9af27/sherpa_onnx-1.13.8-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.13'" },
    { url = "https://files.pythonhosted.org/packages/24/a5/100a7c200e696b2756838b0bdb83e9cf96f62e524d44d43daba0a8e9d6fe/sherpa_onnx-1.13.8-cp314-cp314-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.14'" },
    { url = "https://files.pythonhosted.org/packages/78/6e/8d9b92e95896ec500084e706529f5637eff797246e74c498922f6aa13a53/sherpa_onnx-1.13.8-cp312-cp312-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and python_version == '3.12'" },
    { url = "https://files.pythonhosted.org/packages/ce/7b/9829c8e222e6103fd3571523252974c1095c49ae7d1511babf46c4f0d6ea/sherpa_onnx-1.13.8-cp313-cp313-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and python_version == '3.13'" },
    { url = "https://files.pythonhosted.org/packages/33/f5/ff7f45799a1a77f165410fce5080be2cb59cfc98375bf4a56d7d1fe80540/sherpa_onnx-1.13.8-cp314-cp314-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and python_version == '3.14'" },
]
sherpa-onnx-core = [
    { url = "https://files.pythonhosted.org/packages/94/38/64356ad97f68fffcf01fe7545407ad18a2ea86c1ffae5b0950f7fac73638/sherpa_onnx_core-1.13.8-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://files.pythonhosted.org/packages/8c/2a/2a47b423fe009bbbcb6d7eed7bcba755d6f9ae923b5664c7208128c32d06/sherpa_onnx_core-1.13.8-py3-none-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest-asyncio>=1.3.0",
    "reportlab>=5.0.0",
]
